# Fonte única de parâmetros da coleta (Instagram, YouTube, extração de mídia).
saida_padrao: dados
perfis_csv: config/perfis.csv

# Trava de custo: acima disso, a coleta paga exige --confirmo-custo.
max_perfis_sem_confirmacao: 5

instagram:
  actor_reels: apify/instagram-reel-scraper   # foco do projeto: só Reels
  actor_posts: apify/instagram-scraper
  actor_perfis: apify/instagram-profile-scraper
  idade_minima_dias: 14        # regra do case: métricas estabilizadas
  limite_padrao: 150           # posts por perfil
  max_slides: 10
  tipos:                       # type do Apify -> tipo_post
    Video: reels
    Sidecar: carrossel
    Image: imagem

youtube:
  idade_minima_dias: 14
  short_max_segundos: 180      # heurística: vídeo <= 180 s é Short
  limite_padrao: 150           # vídeos inspecionados por canal (mais recentes)
  baixar_apenas_shorts: true
  formato_ytdlp: "bv*[height<=720][vcodec^=avc1]+ba[ext=m4a]/bv*[height<=720][ext=mp4]+ba/bv*[height<=720]+ba/b"   # DASH + mescla (ffmpeg); o YouTube não serve mais arquivo único em 720p
  # Busca com intenção comercial (--comercial): "<intenção> <ramo>" para cada nicho. Foca em vídeos que ensinam a vender/operar.
  intencoes_comerciais: ["como vender", "como divulgar", "como atrair clientes", "quanto cobrar", "estratégia de vendas"]
  ramo_busca:
    cabeleireira: "salão de beleza"
    esteticista: "clínica de estética"
    confeiteira: "bolos"
    marmiteira: "marmitas"
    loja_roupas: "loja de roupas"
    bijuteria: "bijuterias"
    eletricista: "serviço de eletricista"
    mecanico: "oficina mecânica"
    professor_particular: "aulas particulares"
    pet_banho_tosa: "pet shop"
  # Termos de busca refinados por nicho (src.coleta.youtube_apify --nichos). Sem entrada: 2 termos genéricos.
  termos_nicho:
    confeiteira: ["bolo decorado passo a passo", "brigadeiro gourmet vendas", "quanto cobrar bolo de pote", "confeiteira iniciante faturamento"]
    esteticista: ["limpeza de pele profissional", "design de sobrancelha antes e depois", "maquiagem profissional transformação", "como atrair clientes estética"]

midia:
  gancho_segundos: 3
  gancho_fps: 2                # 1 frame a cada 0,5 s
  corpo_intervalo_s: 3
  largura: 512
  audio_hz: 16000

download:
  tentativas: 4
  timeout_s: 60

descoberta:
  actor_hashtag: apify/instagram-hashtag-scraper
  hashtags: [mei, microempreendedor, pequenosnegocios, empreendedorismo, precificacao, gestaofinanceira]
  reels_por_hashtag: 50
  teto_usd_run: 1.00
  teto_usd_verificacao: 0.25
  seguidores_min: 1000          # descarta contas minúsculas/fantasma

base:
  janela_dias: 365             # atividade nos últimos 12 meses (TAPI)

ranking:
  top_fracao: 0.10             # alto desempenho = top 10% por score_relativo (TAPI)
  min_reels_perfil: 5          # com poucos reels a mediana do perfil não é estável (n=1 dá score 1.0)
  score_extremo: 20            # sinaliza (não remove) outliers de score_relativo
