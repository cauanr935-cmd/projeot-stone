# =============================================================================
# 10 perfis de MPE/MEI prioritários para geração de criativos (motion graphics).
#
# Critério (premissa editável, ver docs/CRIATIVOS.md): 2 ocupações por segmento
# de config/cnae_profiles.yaml (5 segmentos => os 5 formatos da pesquisa),
# priorizando as ocupações MEI mais comuns em cada segmento.
# Cada perfil traz o "material criativo" (dor, solução, número de destaque,
# prova, CTA) que alimenta tanto o modo offline (templates) quanto o LLM.
# Tom Impulso Stone: próximo, simples, sem promessa exagerada.
# Cores: fundo1/fundo2 (gradiente), destaque, acento, texto (hex).
# =============================================================================
version: 1

# Segmentos da base de Reels (dados/) mais próximos de cada segmento CNAE; usados só para
# DESEMPATAR referências (a base é majoritariamente de educação empreendedora, não de nichos).
segmentos_base:
  beleza: [artesanato_varejo, varejo]
  alimentacao: [alimentacao_delivery, artesanato_varejo]
  varejo_moda: [varejo, artesanato_varejo, vendas_ecommerce]
  servicos_tecnicos: [vendas_marketing, precificacao]
  ensino_servicos_locais: [educacao_empreendedora, empreendedorismo]

